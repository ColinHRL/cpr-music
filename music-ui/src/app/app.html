<nav class="app-navbar">
  <div class="cpr-header">
    <a class="app-title" [href]="currentStation().siteUrl" target="_blank" rel="noopener noreferrer">CPR</a>
    <span class="app-title-separator">|</span>
    <span class="app-subtitle">Colorado Public Radio</span>
  </div>
  <div class="navbar-actions">
    <div class="station-buttons">
      <button class="station-button" [class.active]="currentStation().id === 'indie'" (click)="switchStation('indie')">Indie</button>
      <button class="station-button" [class.active]="currentStation().id === 'classical'" (click)="switchStation('classical')">Classical</button>
    </div>
    <a class="donate-button" href="https://donate.cpr.org/give" target="_blank" rel="noopener noreferrer">Donate</a>
  </div>
</nav>
<hr />
<main class="app-container">
  <div class="player-section">
    @if (currentlyPlaying()?.title && currentlyPlaying()?.artist) {
    <div class="song">
      <span class="title">{{ currentlyPlaying()?.title }}</span>
    </div>
    <div class="artist">{{ currentlyPlaying()?.artist }}</div>
    } @else {
    <div>{{ currentlyPlaying()?.line_1 }}</div>
    }

    <app-audio-player></app-audio-player>
  </div>

  <app-track-list></app-track-list>
</main>

<router-outlet />
