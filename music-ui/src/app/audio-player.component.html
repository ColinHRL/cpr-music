<audio #audioPlayer autoplay preload="auto">
  <source src="https://stream1.cprnetwork.org/cpr3_lo" type="audio/mpeg" />
  Your browser does not support the audio element.
</audio>

@if (audioError()) {
  <div class="audio-error">⚠️ {{ audioError() }}</div>
}

<div class="player-controls">
  <button (click)="togglePlayPause()" class="play-pause-btn" [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'">
    @if (isPlaying()) {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true">
        <polygon points="5,3 19,12 5,21" />
      </svg>
    }
  </button>
  <div class="volume-control">
    <span class="volume-icon" (click)="toggleMute()" title="{{ muted() ? 'Unmute' : 'Mute' }}">{{
      muted() ? "🔇" : volume() < 0.5 ? "🔉" : "🔊"
    }}</span>
    <input
      type="range"
      min="0"
      max="1"
      step="0.05"
      [value]="volume()"
      (input)="onVolumeChange($event)"
      class="volume-slider"
      aria-label="Volume"
    />
  </div>
</div>
